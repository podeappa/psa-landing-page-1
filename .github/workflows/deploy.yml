name: 1. Continuous Deployment to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Environment variables for the deployment action
    env:
      VERCEL_PROJECT_ID: <PASTE_YOUR_VERCEL_PROJECT_ID_HERE>
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Best practice for fast CI/CD builds

      - name: Install Dependencies
        run: npm ci

      # FINAL CSS FIX: Explicitly set the POSTCSS_ENV to production before the build
      - name: Build Next.js Application
        run: POSTCSS_ENV=production npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          vercelProjectId: ${{ env.VERCEL_PROJECT_ID }}
          vercelOrgId: ${{ env.VERCEL_ORG_ID }}
          # Set the build output directory to 'out' for static export
          vercelProjectDir: ./out 

      - name: Deployment Verification Check
        if: success()
        run: echo "Vercel Deployment Succeeded! Live URL is available in the Vercel logs."