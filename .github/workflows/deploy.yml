name: 1. Continuous Deployment to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Environment variables for the deployment action
    env:
      VERCEL_PROJECT_ID: <PASTE_YOUR_VERCEL_PROJECT_ID_HERE>
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Best practice for fast CI/CD builds

      # FINAL DEPENDENCY FIX: Performing a full, clean install to bypass CI environment conflicts
      - name: Install Dependencies
        run: |
          npm install --force
          npm cache clean --force

      # FINAL CSS FIX: Explicitly set the POSTCSS_ENV to production before the build
      - name: Build Next.js Application
        run: POSTCSS_ENV=production npm run build

      - name: Deploy to Vercel (Using Build Args)
        uses: amondnet/vercel-action@v25
        with:
          # CRITICAL FIX: Build is now handled by vercel-args to bypass npx conflict
          vercel-args: --prod --prebuilt
          
          # CRITICAL FIX: Using correct kebab-case parameter names
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          
          # Point the action to the built output directory
          vercel-project-dir: ./out