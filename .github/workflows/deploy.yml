# Workflow 1: Automated Deployment Workflow (deploy.yml)
# Status: CORRECTED to use the working 'amondnet/vercel-action@v25'

name: 1. Continuous Deployment to Vercel

on:
  push:
    branches:
      - main

# Security Best Practice: Define minimum necessary permissions (Least Privilege)
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Environment variables for the Vercel Action
    env:
      # CRITICAL: Replace <PASTE_YOUR_VERCEL_PROJECT_ID_HERE> with your actual Project ID.
      # This is NOT a secret and can be checked into the source code.
      VERCEL_PROJECT_ID: prj_d30jtB6BDkUCtJA8Re94zbMaDO62
      
      # VERCEL_ORG_ID is stored securely in GitHub Secrets.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Using 'npm ci' for reproducible and faster CI/CD builds
        run: npm ci

      - name: Build Next.js Application
        # This step performs the compilation and optimization
        run: npm run build

      # -----------------------------------------------------------------
      # FIX IMPLEMENTATION: Changed Action to amondnet/vercel-action@v25
      # This resolves the "Unable to resolve action vercel/actions-deploy" error.
      # -----------------------------------------------------------------
      - name: Deploy to Vercel (Production)
        # Using a widely adopted, community-maintained Vercel action
        uses: amondnet/vercel-action@v25 
        with:
          # VERCEL_TOKEN must be stored securely as a GitHub Secret
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          # Ensures deployment goes to the production domain
          vercel-args: '--prod'
          
      - name: Deployment Verification Check
        if: success()
        run: echo "Vercel Deployment SUCCESSFUL! Check Vercel Dashboard for live URL."
