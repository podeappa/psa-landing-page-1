name: 1. Continuous Deployment to Vercel

on:
  push:
    branches:
      - main

# Define required permissions (Least Privilege Principle)
permissions:
  contents: read # Required for actions/checkout
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Environment variables visible to all steps in this job
    env:
      # CRITICAL: This non-secret ID is the sole reference to the project (replace placeholder)
      VERCEL_PROJECT_ID: prj_d30jtB6BDkUCtJA8Re94zbMaDO62
      # The Organization ID reference is REMOVED to solve the "Project Not Found" error.
      # The token will now default to the context of the token creator (your personal account).

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- PERFORMANCE & RELIABILITY FIX (Caching) ---
      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Use npm for caching

      - name: Install Dependencies
        run: npm ci

      # --- BUILD FIXES (Bypassing Strict Checks) ---
      - name: Build Next.js Application
        # package.json is assumed to have flags: --no-lint --no-typescript
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          # Use secrets for authentication
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          # vercel-org-id is intentionally OMITTED here
          vercel-args: '--prod'

      - name: Deployment Verification Check
        if: success()
        run: echo "Vercel Deployment Succeeded! Your static landing page is now live."
