name: 1. Continuous Deployment to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Environment variables for the deployment action
    env:
      VERCEL_PROJECT_ID: prj_b0z57lzqdktgORH1AmpOoOc0dwS4
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Best practice for fast CI/CD builds

      # Simplified Install: Use standard npm install
      - name: Install Dependencies
        run: npm install

      # Simple Build: Rely on standard Next.js build command
      - name: Build Next.js Application
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          # Simplest arguments possible to ensure success
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          # Point the action to the built output directory
          vercel-project-dir: ./out