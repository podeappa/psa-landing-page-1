name: 2. Pull Request Auto-Closure

on:
  pull_request:
    types: [opened, synchronized, reopened]

permissions:
  pull-requests: write # Grants authority to post comment and close PR
  contents: read # CRITICAL: Allows actions/checkout to clone and establish Git context

jobs:
  check_and_close_pr:
    runs-on: ubuntu-latest

    # Job runs only if the author is NOT the owner
    if: github.actor != github.repository_owner

    steps:
      - name: Checkout Code and Establish Git Context
        uses: actions/checkout@v4
        with:
          # CRITICAL FIX: Fetch depth 0 ensures full history and fixes "not a git repository" error
          fetch-depth: 0 
          
      - name: Post Closure Comment and Close PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPONSE_BODY: "Pull requests from external contributors are not accepted at this time for security reasons. The PR has been automatically closed per repository governance policy."
        run: |
          echo "PR_NUMBER=$PR_NUMBER"
          echo "Adding closure comment to PR #$PR_NUMBER..."
          
          # Use the GitHub CLI tool (gh) to close the PR and add the comment
          gh pr close $PR_NUMBER --comment "$RESPONSE_BODY"