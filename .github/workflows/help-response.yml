name: 3. Issue Comment Response Workflow

on:
  issue_comment:
    types: [created]

permissions:
  issues: write # Grants authority to post a comment
  contents: read # CRITICAL FIX: Allows actions/checkout@v4 to clone the private repo

jobs:
  respond_to_help_command:
    runs-on: ubuntu-latest
    
    # FINAL SYNTAX FIX: This is the correct way to make the trigger case-insensitive in GA expressions.
    if: |
      github.actor != 'github-actions' &&
      startsWith(lower(github.event.comment.body), '/help')

    steps:
      - name: Checkout Code (Required for gh CLI)
        uses: actions/checkout@v4

      - name: Post Automated Response
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESPONSE_BODY: "Currently, help resources are not available. Please refer to the repository README for guidance."
        run: |
          echo "Automated response triggered for issue #$ISSUE_NUMBER"
          gh issue comment $ISSUE_NUMBER --body "$RESPONSE_BODY"