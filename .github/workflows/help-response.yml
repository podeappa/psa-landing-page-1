name: 3. Issue Comment Response Workflow

on:
  issue_comment:
    types: [created]

permissions:
  issues: write # Grants authority to post a comment
  contents: read # CRITICAL: Allows actions/checkout@v4 to clone the private repo

jobs:
  respond_to_help_command:
    runs-on: ubuntu-latest
    
    # The job runs on every comment, but the internal script handles the logic check.
    if: github.actor != 'github-actions' # Anti-loop check remains at job level

    steps:
      - name: Checkout Code (Required for gh CLI)
        uses: actions/checkout@v4

      - name: Post Automated Response
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RESPONSE_BODY: "Currently, help resources are not available. Please refer to the repository README for guidance."
        run: |
          # 1. Calculate the lowercase version of the comment body
          COMMENT_BODY_LOWER=$(echo $COMMENT_BODY | tr '[:upper:]' '[:lower:]')
          
          echo "Checking comment body: $COMMENT_BODY_LOWER"

          # 2. Check if the lowercase body starts with the trigger "/help"
          # The asterisk (*) is a wildcard, checking if the string begins with /help
          if [[ $COMMENT_BODY_LOWER != "/help"* ]]; then
            echo "Condition not met. Exiting gracefully."
            exit 0
          fi
          
          # 3. If the condition is met, post the response
          echo "Trigger found. Posting automated response to Issue #$ISSUE_NUMBER"
          gh issue comment $ISSUE_NUMBER --body "$RESPONSE_BODY"